[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "avocado-tui"
version = "0.1.0"
description = "Terminal-native math notebook with inline results"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "antlr4-python3-runtime==4.11.*",
  "numpy>=1.26",
  "sympy>=1.14",
  "textual>=0.70.0",
]

[project.scripts]
avocado = "avocado_tui.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
